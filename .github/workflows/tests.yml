name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Solo en el repositorio de trabajo: el espejo de SYZ no repite el CI (ADR-030).
    if: github.repository == 'DeividO12/PyMPMS-11.1'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools-scm necesita el historial y los tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,tables]"
      - run: ruff check src tests scripts packaging
      - run: mypy src
      - run: pytest
