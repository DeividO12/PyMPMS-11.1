# Espejo del repositorio personal en sistemasSYZ (docs/decisiones ADR-005 y ADR-030).
#
# Replica cada push (ramas y tags) y cada borrado. El espejo es exacto: lo que se
# suba directamente a sistemasSYZ en una rama replicada se sobrescribe.
# Excepción: la rama `dist` solo existe en SYZ (la escribe packaging/publish.py).
name: mirror

on:
  push:
    branches: ["**"]
    tags: ["**"]
  delete:

permissions:
  contents: read

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'DeividO12/PyMPMS-11.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replicar en sistemasSYZ/PyMPMS-11.1
        env:
          TOKEN: ${{ secrets.SYZ_RELEASE_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.event.ref_type }}
          DELETED_REF: ${{ github.event.ref }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secreto SYZ_RELEASE_TOKEN (ver packaging/README.md)"
            exit 1
          fi
          url="https://x-access-token:${TOKEN}@github.com/sistemasSYZ/PyMPMS-11.1.git"
          if [ "$EVENT" = "delete" ]; then
            if [ "$REF_TYPE" = "tag" ]; then ref="refs/tags/$DELETED_REF"; else ref="refs/heads/$DELETED_REF"; fi
            git push "$url" --delete "$ref" || echo "::warning::$ref no existía en SYZ"
          else
            git push --force "$url" "${GITHUB_SHA}:${GITHUB_REF}"
          fi
