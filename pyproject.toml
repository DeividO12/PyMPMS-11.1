[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pympms-11-1"
dynamic = ["version"]
description = "Python implementation of API MPMS Chapter 11.1 for petroleum measurement"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

authors = [
  { name = "Deivid Cubillos" }
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering"
]

[project.optional-dependencies]
tables = ["numpy>=1.24", "pandas>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "api_mpms.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
api_mpms = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "E722"]
